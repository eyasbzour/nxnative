# Area labels on pull requests (dm/tools/pr_areas.py): host, nvn, shader chain, … from the paths a PR changes, "game: <title ID>" for each profile it touches, and
# "new game". pull_request_target runs with a token that may label, so this workflow checks out main only and never runs anything from the pull request: it reads the
# PR's list of changed paths through the API and hands it to main's pr_areas.py. Labels are added, never removed. A pull request's run creates only the labels that are
# missing, so colours and descriptions edited by hand stay; run it by hand (workflow_dispatch) to label every open PR and reset the labels to pr_areas.py's.
name: pr-areas

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  issues: write          # creating a label
  pull-requests: write   # adding it to a pull request

concurrency:
  group: pr-areas-${{ github.event.pull_request.number || 'all' }}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}   # main, never the pull request's head
          persist-credentials: false
      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # gh helper with a hard cap: at most 2 extra attempts (3 total), 10 s apart
          gh_ok() {
            if "$@"; then return 0; fi
            echo "gh failed once, retrying in 10 s: $*" >&2
            sleep 10
            if "$@"; then return 0; fi
            echo "gh failed twice, last try in 10 s: $*" >&2
            sleep 10
            "$@"
          }
          prs=${PR:-$(gh_ok gh pr list --state open --limit 1000 --json number --jq '.[].number')}
          declare -A made   # labels that exist (a pull request's run) or were reset in this run (by hand)
          if [ -n "$PR" ]; then while IFS= read -r name; do made[$name]=1; done < <(gh_ok gh label list --limit 1000 --json name --jq '.[].name'); fi
          for n in $prs; do
            gh_ok gh api --paginate "repos/$GH_REPO/pulls/$n/files" --jq '.[].filename' | python3 dm/tools/pr_areas.py > labels.tsv   # every file (gh pr view stops at 100)
            add=()
            while IFS=$'\t' read -r name color desc; do
              if [ -z "${made[$name]:-}" ]; then gh_ok gh label create "$name" --color "$color" --description "$desc" --force > /dev/null; made[$name]=1; fi
              add+=(--add-label "$name")
            done < labels.tsv
            if [ ${#add[@]} -gt 0 ]; then gh_ok gh pr edit "$n" "${add[@]}" > /dev/null; fi
            echo "#$n: $(cut -f1 labels.tsv | paste -sd, -)"
          done
