# Build a game IPA with nxnative on GitHub's hosted macOS runners.
# Add this file to a fork of seedds/nxnative at .github/workflows/build-ipa.yml
#
# The game files reach the runner over a temporary tunnel from serve_game.ps1
# running on your Windows PC. With game_release set, the first run also saves
# them (never prod.keys) to a draft release of that tag, which only the fork's
# writers can see, and later runs with the same game_release take them from
# there, without the feeder. upload_game.py (in the Windows kit) fills such a
# release from your PC instead, resuming after an interruption. prod.keys comes from the PROD_KEYS secret (base64
# of the file) when it is set, else from the feeder. Never publish a game_release.
# When the build finishes, the IPA goes up as release parts (each under 2 GB).
#
# Runtime: the registered TotK profile (base v0 + update 1.4.3 = v720896)
# needs no Mac-host boot, so this job stays compute and disk only.

name: Build the game IPA

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "The manifest URL that serve_game.ps1 printed (not needed when game_release already holds the game files)"
        required: false
        default: ""
      game_release:
        description: "Tag of a private draft release for the game files, e.g. game-wonder-121: taken from it when it exists, else fetched from the feeder and saved to it"
        required: false
        default: ""
      app_name:
        description: "App name on the iPhone home screen"
        required: false
        default: ""
      package:
        description: "Version to pack, e.g. v720896 (empty = the newest in the folder)"
        required: false
        default: ""
      extra_flags:
        description: "Flags for build_ipa_from_nsp.py; default builds a self-contained IPA (game files packed inside). Add --romfs separate only if the runner runs out of disk"
        required: false
        default: ""
      ipa_name:
        description: "Short slug for the IPA file and release assets; empty = derived from the manifest's game name"
        required: false
        default: ""

env:
  # The toolchain the project supports (README: Xcode 27.1; dm/gfx/tools/dmsh_chain.lock: its Metal compiler),
  # named by path so the image's default moving to another Xcode does not move this job.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  # the runner's Metal compiler is 27.1's (the lockfile was made with 27.2's): every step, the
  # toolchain check and the build, builds with it anyway (the merge of main into this branch
  # keeps dropping a step-level override, so it lives at the top level)
  DM_ALLOW_OTHER_METAL: "1"

permissions:
  contents: write   # the job publishes the release with the IPA parts

defaults:
  run:
    shell: bash

jobs:
  build-ipa:
    runs-on: xcode-27
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Disk space before cleanup
        run: df -h / "$RUNNER_TEMP"

      - name: Free disk space
        run: |
          for d in /Applications/Xcode*.app; do
            case "$d" in *Xcode_27.1*) ;; *) sudo rm -rf "$d" ;; esac
          done
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          sudo rm -rf ~/Library/Android 2>/dev/null || true
          brew cleanup --prune=all >/dev/null 2>&1 || true
          df -h / "$RUNNER_TEMP"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install the Python packages the tools import
        run: python -m pip install -r .github/requirements/tools.txt

      - name: Install the build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install xcodegen zstd glslang aria2
          brew install --cask dotnet-sdk

      - name: Toolchain check (Xcode, iOS SDK, Metal compiler)
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -sdk iphoneos metal --version
          python3 dm/gfx/tools/own_compilers.py --check-metal

      - name: Fetch the game files (a draft release saved by an earlier run, else serve_game.ps1 on your PC)
        working-directory: ${{ runner.temp }}
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          GAME_RELEASE: ${{ inputs.game_release }}
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p game
          # The release that holds the game files: a draft (only the fork's writers see a draft or its files), found by its tag
          # name among all releases, as the by-tag lookup does not return drafts
          rel_id=
          if [ -n "$GAME_RELEASE" ]; then
            rel_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq ".[] | select(.tag_name == \"$GAME_RELEASE\") | .id" | head -1)
          fi
          if [ -n "$rel_id" ]; then
            echo "game files from the draft release $GAME_RELEASE (no feeder needed)"
            # The release's layout (the save step below and upload_game.py on your PC write it): game.json names each file
            # ({"game": base name, "files": [{"id", "name", "size", "sha256"}]}) and its pieces are <id>.part-NNN, as GitHub
            # renames release files whose names hold spaces or brackets. game.json goes up last: without it the upload is unfinished
            mkdir -p parts
            gh api "repos/$GITHUB_REPOSITORY/releases/$rel_id/assets?per_page=100" --paginate --jq '.[] | select(.state == "uploaded") | "\(.id)\t\(.name)"' > assets.tsv
            grep -q $'\tgame.json$' assets.tsv || { echo "::error::the draft release $GAME_RELEASE has no game.json: its upload is unfinished (run upload_game.py again) or it is not a game release"; exit 1; }
            while IFS=$'\t' read -r id name; do
              echo "downloading piece: $name"
              for attempt in 1 2 3 4 5; do
                gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "parts/$name" < /dev/null && break
                [ "$attempt" = 5 ] && { echo "::error::$name: the download failed 5 times"; exit 1; }
                sleep 20
              done
            done < assets.tsv
            python3 - <<'PY'
          import hashlib, json, pathlib
          parts = pathlib.Path('parts'); index = json.loads((parts / 'game.json').read_text())
          for f in index['files']:
              pieces = sorted(parts.glob(f['id'] + '.part-*'))
              h = hashlib.sha256(); size = 0
              with open(pathlib.Path('game') / f['name'], 'wb') as out:
                  for piece in pieces:
                      data = piece.read_bytes(); h.update(data); size += len(data); out.write(data); piece.unlink()
              if size != f['size'] or h.hexdigest() != f['sha256']:
                  raise SystemExit(f"{f['name']}: {len(pieces)} pieces make {size} bytes with SHA-256 {h.hexdigest()}, not the {f['size']} bytes and {f['sha256']} recorded: the release is incomplete or damaged")
              print(f"{f['name']}: {size} bytes, SHA-256 matches")
          json.dump({'game': index['game']}, open('manifest.json', 'w'))
          PY
            rm -rf parts
          else
            [ -n "$MANIFEST_URL" ] || { echo "::error::no draft release $GAME_RELEASE and no manifest_url: run serve_game.ps1 and give its manifest URL"; exit 1; }
            curl -fsS --retry 10 --retry-delay 5 "$MANIFEST_URL" -o manifest.json
            python3 - <<'PY' > dl.tsv
          import json, sys
          m = json.load(open('manifest.json'))
          files = m.get('files', [])
          if not files:
              sys.exit('the manifest holds no files')
          for e in files:
              print(e['url'] + '\t' + e['out'])
          PY
            # aria2c gives up on a 530 (the tunnel has no connection to the PC: its Wi-Fi dropped, a sleep), so each file is tried
            # again for up to 30 minutes of such outages; --continue keeps what arrived, and the next try asks only for the rest.
            # prod.keys comes from the PROD_KEYS secret when it is set, so the feeder's copy is not fetched
            while IFS=$'\t' read -r url out; do
              if [ "$out" = prod.keys ] && [ -n "$PROD_KEYS_B64" ]; then continue; fi
              echo "downloading: $out"
              for attempt in $(seq 1 60); do
                if aria2c --console-log-level=warn --summary-interval=60 --max-tries=30 --retry-wait=10 \
                     --connect-timeout=30 --continue --file-allocation=none \
                     --max-connection-per-server=8 --split=8 --min-split-size=50M \
                     -d game -o "$out" "$url" < /dev/null; then break; fi
                [ "$attempt" = 60 ] && { echo "::error::$out: the feeder stayed unreachable for 30 minutes"; exit 1; }
                echo "::warning::$out: the feeder is unreachable (try $attempt); trying again in 30 s, resuming what arrived"
                sleep 30
              done
              echo "download complete: $out"
            done < dl.tsv
          fi
          # The keys: the PROD_KEYS secret (base64 of prod.keys), else the feeder's copy. Never saved to a release
          if [ -n "$PROD_KEYS_B64" ]; then printf '%s' "$PROD_KEYS_B64" | base64 -D > game/prod.keys; echo "prod.keys from the PROD_KEYS secret"; fi
          [ -s game/prod.keys ] || { echo "::error::no prod.keys: set the PROD_KEYS secret, or give a manifest_url whose feeder serves it"; exit 1; }
          # IPA/release slug: workflow input if given, else derived from the manifest's game name
          # ("The Legend of Zelda Tears of the Kingdom [0100...].xci" -> "the-legend-of-zelda-tears-of-the-kingdom")
          if [ -n "${{ inputs.ipa_name }}" ]; then
            IPA_NAME="${{ inputs.ipa_name }}"
          else
            IPA_NAME=$(python3 -c "import json, re; g = json.load(open('manifest.json'))['game']; g = re.split(r' ?\[', g)[0]; print(re.sub(r'[^A-Za-z0-9]+', '-', g).strip('-').lower() or 'game')")
          fi
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "IPA name: $IPA_NAME"
          echo "GAME_RELEASE_FOUND=${rel_id:+1}" >> "$GITHUB_ENV"
          ls -lh game
          # The feeder on your PC can be stopped (Ctrl+C) from here on.
          echo "ALL DOWNLOADS COMPLETE"

      - name: Save the game files to a draft release, so later builds skip the feeder
        if: inputs.game_release != '' && env.GAME_RELEASE_FOUND != '1'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_RELEASE: ${{ inputs.game_release }}
        run: |
          set -e
          # The game files only, never prod.keys, in the layout the fetch step reads (pieces <id>.part-NNN under GitHub's 2 GB
          # per file, and game.json). A draft: only the fork's writers see it. Publishing it would make the game public
          mkdir -p save
          python3 - <<'PY'
          import hashlib, json, pathlib
          files = sorted(p for p in pathlib.Path('game').iterdir() if p.name != 'prod.keys')
          index = {'game': json.load(open('manifest.json'))['game'], 'files': []}
          for i, p in enumerate(files, 1):
              h = hashlib.sha256(); size = 0
              with open(p, 'rb') as f:
                  for n, data in enumerate(iter(lambda: f.read(1900 * 2**20), b'')):
                      h.update(data); size += len(data); (pathlib.Path('save') / f'f{i}.part-{n:03d}').write_bytes(data)
              index['files'].append({'id': f'f{i}', 'name': p.name, 'size': size, 'sha256': h.hexdigest()})
          pathlib.Path('save/game.json').write_text(json.dumps(index, indent=1) + '\n')
          PY
          ls -lh save
          gh release create "$GAME_RELEASE" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Game files: $GAME_RELEASE (private draft, do not publish)" \
            --notes "Game files saved by run $GITHUB_RUN_NUMBER for later builds (build-ipa.yml game_release). A draft: only the fork's writers can see it. Do not publish it." \
            save/f*.part-*
          gh release upload "$GAME_RELEASE" --repo "$GITHUB_REPOSITORY" save/game.json   # last, as the fetch step takes a release once it is there
          rm -rf save
          echo "saved the game files to the draft release $GAME_RELEASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the app and the IPA
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out"
          app="${{ inputs.app_name }}"
          pkg="${{ inputs.package }}"
          extra="${{ inputs.extra_flags }}"
          args=(--work-dir "$RUNNER_TEMP/work" -o "$RUNNER_TEMP/out/${IPA_NAME}.ipa")
          if [ -n "$app" ];   then args+=(--app-name "$app"); fi
          if [ -n "$pkg" ];   then args+=(-p "$pkg"); fi
          if [ -n "$extra" ]; then read -r -a extra_args <<< "$extra"; args+=("${extra_args[@]}"); fi
          python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" -k "$RUNNER_TEMP/game/prod.keys" --progress lines "${args[@]}"
          ls -lh "$RUNNER_TEMP/out"
          rm -rf "$RUNNER_TEMP/game"

      - name: Upload the IPA as release parts (each under 2 GB)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p parts
          split -d -b 1900m "$RUNNER_TEMP/out/${IPA_NAME}.ipa" "parts/${IPA_NAME}.ipa.part-"
          rm -f "$RUNNER_TEMP/out/${IPA_NAME}.ipa"
          test -f "parts/${IPA_NAME}.ipa.part-00" || { echo "the IPA split produced nothing"; exit 1; }
          ls -lh parts
          tag="ipa-${GITHUB_RUN_NUMBER}"
          # a draft: the IPA holds the game, so only people with push access to this fork see the release
          gh release create "$tag" --draft parts/"${IPA_NAME}".ipa.part-* \
          --title "$IPA_NAME (run ${GITHUB_RUN_NUMBER})" \
            --title "IPA (run $GITHUB_RUN_NUMBER)" \
            --notes "Join the parts with join_ipa.ps1 from the kit, then follow the kit's install steps."
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the transferred game files
        if: always()
        run: rm -rf "$RUNNER_TEMP/game" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/dl.tsv"
